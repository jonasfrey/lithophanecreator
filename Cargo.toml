[package]
name = "lithophane-creator"
version = "0.1.0"
edition = "2024"
description = "Create printable vertical lithophanes (with breakaway supports) from an image and an extruded-outline STL"

[dependencies]
eframe = { version = "0.37", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "glow",
    "persistence",
    "wayland",
    "x11",
] }
earcut = "0.4"
glam = "0.34"
image = "0.25"
rayon = "1.12"
rfd = { version = "0.17", default-features = false, features = ["gtk3"] }
serde = { version = "1", features = ["derive"] }
stl_io = "0.11"
serde_json = "1.0.154"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
debug = false
